name: Tournament Monitor Cron

on:
  schedule:
    # 30分ごとに自動実行（UTC表記）
    - cron: '*/30 * * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # DBファイルをGitに書き戻す権限

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Monitor Script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py

      - name: Commit and Push DB Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tournaments.db
          # DBに変化があった場合のみコミット＆Push（無駄な更新履歴の防止）
          git diff --staged --quiet || (git commit -m "Auto-update tournaments.db [skip ci]" && git push)
